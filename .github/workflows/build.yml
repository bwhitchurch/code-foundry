name: Build demo binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync

      - name: Build with PyInstaller
        shell: bash
        run: |
          uv run pyinstaller \
            --noconsole \
            --onefile \
            --name CodeFoundry \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeFoundry-${{ matrix.os }}
          path: dist/*
