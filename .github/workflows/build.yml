name: Build demo binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync

      ### Build Steps Per OS ###
      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv run pyinstaller --onefile --name CodeFoundry main.py

      - name: Build (MacOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv run pyinstaller --windowed --name CodeFoundry main.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run pyinstaller --noconsole --onefile --name CodeFoundry.exe main.py

      # -------------------------
      # Package into ONE zip (per OS)
      # -------------------------
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Force -Path dist\CodeFoundry.exe -DestinationPath out\CodeFoundry-windows.zip

      - name: Package (macOS zip .app)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p out
          # Zip the .app bundle correctly
          ditto -c -k --sequesterRsrc --keepParent "dist/CodeFoundry.app" "out/CodeFoundry-macos.zip"

      - name: Package (Linux zip)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p out
          tar -czf "out/CodeFoundry-linux.tar.gz" "dist/CodeFoundry"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeFoundry-${{ runner.os }}-${{ runner.arch }}
          path: |
            out/*.zip
            out/*.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: Create Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: out/**/CodeFoundry-*
          draft: true
